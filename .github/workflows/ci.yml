  lhci:
    name: Lighthouse
    runs-on: ubuntu-latest
    # Auth is unresolved, so this job is advisory (does not fail CI) until a
    # working credential exists:
    #   - client_id/client_secret (Dev Dashboard app): authenticates, then
    #     `themeCreate` returns ACCESS_DENIED -- that mutation needs a
    #     Shopify-granted exemption on top of write_themes.
    #   - access_token (Theme Access shptka_ token): 401 on `publicApiVersions`
    #     during `shopify theme push --development` in CI, even though the same
    #     token lists themes fine via `shopify theme list` locally.
    # Remove continue-on-error once the action can create a development theme.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Lighthouse
        uses: shopify/lighthouse-ci-action@v1
        with:
          store: ${{ secrets.SHOP_STORE_OS2 }}
          password: ${{ secrets.SHOP_PASSWORD_OS2 }}
          access_token: ${{ secrets.SHOP_ACCESS_TOKEN }}
          product_handle: ${{ secrets.SHOP_PRODUCT_HANDLE }}
          collection_handle: ${{ secrets.SHOP_COLLECTION_HANDLE }}
          pull_theme: ${{ secrets.SHOP_PULL_THEME }}
          # 0.6 matches the >= 60 Lighthouse bar and the action's own default. It was
          # pinned at 0.8, which is tighter than run-to-run noise allows on this theme.
          lhci_min_score_performance: 0.6
          lhci_min_score_accessibility: 0.8
          # lhci_github_app_token is optional; without it the job still passes/fails and
          # prints scores to its log. Add secrets.LHCI_GITHUB_APP_TOKEN to get PR comments.
  theme-check:
    name: Theme Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Theme Check
        uses: shopify/theme-check-action@v2
        with:
          token: ${{ github.token }}