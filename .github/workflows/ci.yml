  lhci:
    name: Lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: lhci-${{ github.ref }}
      cancel-in-progress: true
    # `shopify/lighthouse-ci-action` is not used: it always creates a scratch
    # development theme (themeCreate) and mis-wires auth in CI. Instead we drive the
    # CLI directly with a Theme Access token the way it works locally --
    # `shopify theme dev` serves branch code on localhost, then Lighthouse audits it.
    #
    # The store is hardcoded on purpose: it is not secret (it is in CLAUDE.md /
    # docs/perf/backlog.md) and the old SHOP_STORE_OS2 secret held the WRONG domain,
    # which is what produced the publicApiVersions 401 -- a valid token pointed at the
    # wrong store. Only SHOP_ACCESS_TOKEN (a shptka_ Theme Access password) is a secret.
    #
    # continue-on-error stays ONLY until the per-URL floors in docs/perf/ci-floors.json
    # are calibrated to the scores this job produces on a runner. Remove it once the
    # first green run's medians are baked into ci-floors.json.
    continue-on-error: true
    env:
      STORE: c2da09-15.myshopify.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Shopify CLI
        run: npm install -g @shopify/cli
      - name: Warm Lighthouse CLI cache
        run: npx --yes lighthouse@13 --version
      - name: Lighthouse against `shopify theme dev`
        env:
          SHOPIFY_CLI_THEME_TOKEN: ${{ secrets.SHOP_ACCESS_TOKEN }}
          SHOPIFY_FLAG_STORE: ${{ env.STORE }}
          PERF_BASE_URL: http://127.0.0.1:9292
          PERF_PRODUCT_PATH: /products/${{ secrets.SHOP_PRODUCT_HANDLE }}
          PERF_COLLECTION_PATH: /collections/${{ secrets.SHOP_COLLECTION_HANDLE }}
        run: |
          set -eo pipefail
          # Strip any stray whitespace from the pasted token (cheap insurance).
          SHOPIFY_CLI_THEME_TOKEN=$(printf '%s' "$SHOPIFY_CLI_THEME_TOKEN" | tr -d '[:space:]')
          export SHOPIFY_CLI_THEME_TOKEN

          echo "CLI: $(shopify version) | store: $SHOPIFY_FLAG_STORE"
          # Fast auth check before the slower `theme dev` -- fail loudly on a bad token.
          shopify theme list --store "$SHOPIFY_FLAG_STORE" >/dev/null \
            || { echo "::error::Theme Access token rejected by $SHOPIFY_FLAG_STORE"; exit 1; }

          echo "--- starting theme dev ---"
          shopify theme dev --store "$SHOPIFY_FLAG_STORE" --port 9292 > theme-dev.log 2>&1 &
          DEV_PID=$!
          trap 'kill $DEV_PID 2>/dev/null || true' EXIT
          up=""
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://127.0.0.1:9292; then up=1; break; fi
            kill -0 $DEV_PID 2>/dev/null || break
            sleep 2
          done
          if [ -z "$up" ]; then
            echo "::error::shopify theme dev did not come up"; cat theme-dev.log; exit 1
          fi
          echo "--- theme dev up ---"; head -n 40 theme-dev.log
          node docs/perf/measure.js ci-perf
          node docs/perf/ci-gate.js ci-perf
      - name: Upload Lighthouse output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-${{ github.run_id }}
          path: |
            ci-perf/lh_summary.json
            theme-dev.log
          if-no-files-found: warn
  theme-check:
    name: Theme Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Theme Check
        uses: shopify/theme-check-action@v2
        with:
          token: ${{ github.token }}