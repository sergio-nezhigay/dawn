  lhci:
    name: Lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: lhci-${{ github.ref }}
      cancel-in-progress: true
    # `shopify/lighthouse-ci-action` is not used: it always creates a scratch
    # development theme (themeCreate) and mis-wires the Theme Access token in CI
    # (401 on publicApiVersions -- Shopify/lighthouse-ci-action#41). Instead we
    # drive the CLI directly the way it works locally: SHOPIFY_CLI_THEME_TOKEN +
    # `shopify theme dev` serve branch code on localhost, then Lighthouse audits it.
    #
    # continue-on-error stays ONLY until the per-URL floors in docs/perf/ci-floors.json
    # are calibrated to the scores this job actually produces on a CI runner (the
    # localhost dev render is slower than the production URL the baseline used).
    # Remove it once the first green run's medians are baked into ci-floors.json.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Shopify CLI
        run: npm install -g @shopify/cli
      - name: Warm Lighthouse CLI cache
        run: npx --yes lighthouse@13 --version
      - name: Lighthouse against `shopify theme dev`
        env:
          SHOPIFY_CLI_THEME_TOKEN: ${{ secrets.SHOP_ACCESS_TOKEN }}
          SHOPIFY_FLAG_STORE: ${{ secrets.SHOP_STORE_OS2 }}
          PERF_BASE_URL: http://127.0.0.1:9292
          PERF_PRODUCT_PATH: /products/${{ secrets.SHOP_PRODUCT_HANDLE }}
          PERF_COLLECTION_PATH: /collections/${{ secrets.SHOP_COLLECTION_HANDLE }}
        run: |
          set -eo pipefail

          # The CI 401 on publicApiVersions hit `theme list` too (not just the action or
          # `theme dev`), and the raw secrets printed 39 / 26 bytes -- `c2da09-15.myshopify.com`
          # is 23, so at least SHOP_STORE_OS2 carries trailing junk from a bad paste.
          # Sanitize both defensively: strip whitespace, and strip protocol / trailing slash
          # from the store (a leading https:// is a known cause of this exact 401).
          RAW_TOKEN_BYTES=$(printf '%s' "$SHOPIFY_CLI_THEME_TOKEN" | wc -c)
          RAW_STORE_BYTES=$(printf '%s' "$SHOPIFY_FLAG_STORE" | wc -c)
          SHOPIFY_CLI_THEME_TOKEN=$(printf '%s' "$SHOPIFY_CLI_THEME_TOKEN" | tr -d '[:space:]')
          SHOPIFY_FLAG_STORE=$(printf '%s' "$SHOPIFY_FLAG_STORE" | tr -d '[:space:]' | sed -E 's#^https?://##; s#/+$##')
          export SHOPIFY_CLI_THEME_TOKEN SHOPIFY_FLAG_STORE

          echo "CLI: $(shopify version)"
          echo "token: ${RAW_TOKEN_BYTES} raw -> $(printf '%s' "$SHOPIFY_CLI_THEME_TOKEN" | wc -c) clean bytes, md5 $(printf '%s' "$SHOPIFY_CLI_THEME_TOKEN" | md5sum | cut -c1-8) (shptka_ + 32 hex = 39)"
          echo "store: ${RAW_STORE_BYTES} raw -> $(printf '%s' "$SHOPIFY_FLAG_STORE" | wc -c) clean bytes, value [$SHOPIFY_FLAG_STORE]"
          case "$SHOPIFY_FLAG_STORE" in
            *.myshopify.com) ;;
            *) echo "::error::SHOP_STORE_OS2 is not a <name>.myshopify.com domain after sanitizing: [$SHOPIFY_FLAG_STORE]"; exit 1 ;;
          esac

          echo "--- theme list probe (backlog says this works locally with the token) ---"
          shopify theme list --store "$SHOPIFY_FLAG_STORE" || echo "::warning::theme list FAILED ($?)"

          echo "--- starting theme dev ---"
          shopify theme dev --store "$SHOPIFY_FLAG_STORE" --port 9292 > theme-dev.log 2>&1 &
          DEV_PID=$!
          trap 'kill $DEV_PID 2>/dev/null || true' EXIT
          up=""
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://127.0.0.1:9292; then up=1; break; fi
            kill -0 $DEV_PID 2>/dev/null || break
            sleep 2
          done
          if [ -z "$up" ]; then
            echo "::error::shopify theme dev did not come up"; cat theme-dev.log; exit 1
          fi
          echo "--- theme dev up ---"; head -n 40 theme-dev.log
          node docs/perf/measure.js ci-perf
          node docs/perf/ci-gate.js ci-perf
      - name: Upload Lighthouse output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-${{ github.run_id }}
          path: |
            ci-perf/lh_summary.json
            theme-dev.log
          if-no-files-found: warn
  theme-check:
    name: Theme Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Theme Check
        uses: shopify/theme-check-action@v2
        with:
          token: ${{ github.token }}