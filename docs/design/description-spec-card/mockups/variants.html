<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<style>
:root{--ui-navy:#001e3c;--ui-blue:#0071dc;--ui-line:#e5e7eb;--ui-muted:#5b6573;--ui-tint:#f6f9fd;--ui-blue-soft:#eff6ff}
html{font-size:62.5%}
body{margin:0;background:#f7f8fa;font-family:"Assistant",Arial,sans-serif;font-size:1.5rem;letter-spacing:.06rem;line-height:1.8;color:var(--ui-navy)}
.wrap{display:flex;flex-wrap:wrap;gap:24px;padding:16px}
.col{background:#fff;padding:0 0 16px;width:var(--w)}
.tag{font:600 13px/1 monospace;background:#001e3c;color:#fff;padding:6px 8px;display:inline-block;margin-bottom:12px;letter-spacing:0}
h2.description__headings{font-family:'Chakra Petch','Tektur',sans-serif;font-weight:600;color:var(--ui-navy);margin:0 0 1.6rem;text-transform:uppercase;font-size:26px;letter-spacing:.03em;line-height:1.1;border-bottom:.1rem solid var(--ui-line);padding-bottom:.8rem}
.description__text{margin-top:.8rem;font-size:1.5rem;line-height:1.6;color:var(--ui-navy)}
.description__text p{margin:0 0 1rem}
/* ---- A: current ---- */
.A li,.A p:has(> i:first-child){list-style:none;margin:0;padding:.7rem 0;border-bottom:.1rem solid var(--ui-line)}
.A i{font-style:normal;color:var(--ui-muted)}
/* ---- B: two-column spec table with hairlines ---- */
.spec{margin:0;padding:0}
.spec .row{display:grid;grid-template-columns:minmax(0,19rem) 1fr;gap:2rem;padding:.9rem 0;border-bottom:.1rem solid var(--ui-line);letter-spacing:.02rem}
.spec .row:last-child{border-bottom:0}
.spec .k{color:var(--ui-muted)}
.spec .v{font-weight:600}
/* ---- C: zebra card ---- */
.C .spec{border:1px solid var(--ui-line);border-radius:12px;overflow:hidden}
.C .spec .row{border:0;padding:.9rem 1.4rem}
.C .spec .row:nth-child(odd){background:var(--ui-tint)}
/* ---- D: dotted leader ---- */
.D .spec .row{display:flex;gap:.6rem;border:0;padding:.5rem 0;align-items:baseline}
.D .spec .k{flex:none;max-width:50%}
.D .spec .row::after{content:none}
.D .spec .dots{flex:1;border-bottom:1px dotted #b8c0cc;transform:translateY(-.4rem);min-width:2rem}
.D .spec .v{flex:none;max-width:55%;text-align:right}
/* ---- E: stacked on phone, 2-col grid of cards ---- */
.E .spec{display:grid;grid-template-columns:1fr 1fr;gap:0 2.4rem}
.E .spec .row{display:block;padding:.8rem 0}
.E .spec .row:nth-last-child(-n+2){border-bottom:0}
.E .spec .k{display:block;font-size:1.25rem;line-height:1.3}
.E .spec .v{display:block;font-weight:600}
.E.narrow .spec{grid-template-columns:1fr}
.E.narrow .spec .row:nth-last-child(2){border-bottom:.1rem solid var(--ui-line)}
/* phone tweak for B/C: narrower label */
.narrow .spec .row{grid-template-columns:minmax(0,42%) 1fr;gap:1.2rem}
.narrow.C .spec .row{padding:.9rem 1.2rem}
</style></head><body><div class="wrap" id="wrap"></div>
<script>
const rows=[["Виробник","Hynix"],["Модель","Hynix DDR3L 1600 SO-DIMM 8Gb"],["Артикул","HMT41GS6BFR8A-PB"],["Опис","DDR3L 1600 (PC 12800) SODIMM 204 pin, 1x8 Гб, 1.35 В, CL 11"],["Тип пам'яті","DDR3"],["Тактова частота","1600 МГц"],["Пропускна здатність","1600Mhz 12800 Mb/s"],["Обсяг","8 Гб"],["Напруга живлення","1.35 В або 1,5 В (універсальна)"],["Тип","Для ноутбуків"]];
const w=new URLSearchParams(location.search).get('w')||'652';
const narrow=+w<500?' narrow':'';
const cur=rows.map(([k,v])=>`<p><i>${k}</i>: ${v}</p>`).join('');
const spec=`<div class="spec">${rows.map(([k,v])=>`<div class="row"><span class="k">${k}</span>${''}<span class="v">${v}</span></div>`).join('')}</div>`;
const specD=`<div class="spec">${rows.map(([k,v])=>`<div class="row"><span class="k">${k}</span><span class="dots"></span><span class="v">${v}</span></div>`).join('')}</div>`;
const V={A:['A — зараз',cur],B:['B — 2 колонки, лінії',spec],C:['C — смугаста картка',spec],D:['D — крапкові лідери',specD],E:['E — підпис над значенням',spec]};
const only=new URLSearchParams(location.search).get('v');
for(const [id,[t,h]] of Object.entries(V)){ if(only&&!only.includes(id))continue;
 document.getElementById('wrap').insertAdjacentHTML('beforeend',`<div class="col ${id}${narrow}" style="--w:${w}px"><div class="tag">${t}</div><h2 class="description__headings">Опис</h2><div class="description__text">${h}</div></div>`)}
</script></body></html>
